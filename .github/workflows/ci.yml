name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Pass files explicitly: Node 22+ treats a bare directory argument as a glob pattern.
      - run: node --test dist/test/*.test.js
      - name: CLI smoke test
        run: |
          node dist/src/bin.js years
          node dist/src/bin.js list 2027 --all --region Rangamati
          node dist/src/bin.js export 2027 --format ics --out /tmp/bd-2027.ics
          node dist/src/bin.js sources
      - name: Run examples
        run: |
          node examples/basic.mjs
          node examples/delivery-sla.mjs
          node examples/hill-district-office.mjs
      - name: Check the packed tarball
        run: npm pack --dry-run
